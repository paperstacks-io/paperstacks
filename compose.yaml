services:
  paperstacks:
    build:
      context: ./backend/
      args:
        GO_VERSION: ${GO_VERSION:-1}
        APP_VERSION: ${APP_VERSION:-development}
        APP_GIT_HASH: ${APP_GIT_HASH}
      labels:
        org.opencontainers.image.source: https://github.com/paperstacks-io/paperstacks
        org.opencontainers.image.description: paperstacks-io
        org.opencontainers.image.licenses: MIT
    image: ghcr.io/paperstacks-io/paperstacks:latest
    ports:
      - "8080:8080"
    environment:
      HOST: 0.0.0.0
      DATABASE_URL: postgres://app_rw:${DB_APP_RW_PASSWORD_URLENCODED:?Set DB_APP_RW_PASSWORD_URLENCODED from secrets/db_app_rw_password.txt}@db:5432/paperstacks?sslmode=disable
      S3_ENDPOINT_URL: http://rustfs:9000
      S3_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      S3_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      S3_REGION: eu-central-1
      HANKO_API_URL: ${HANKO_API_URL:-}

  db:
    image: postgres:18-alpine
    restart: always
    entrypoint:
      - /bin/sh
      - /db/install-pg-cron.sh
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_cron
      - -c
      - cron.database_name=paperstacks
      - -c
      - cron.timezone=UTC
      - -c
      - cron.use_background_workers=on
    # set shared memory limit when using docker compose
    shm_size: 128mb
    ports:
      - "5432:5432"
    volumes:
      - ./db/init-scripts:/docker-entrypoint-initdb.d:ro
      - ./db/install-pg-cron.sh:/db/install-pg-cron.sh:ro
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/db_super_password
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      PG_CRON_VERSION: "1.6.7"
    secrets:
      - db_super_password
      - db_app_rw_password
      - db_app_ro_password

  pdfextractor:
    build:
      context: ./backend/
      dockerfile: Dockerfile.pdfextractor
      args:
        GO_VERSION: ${GO_VERSION:-1}
        APP_VERSION: ${APP_VERSION:-development}
        APP_GIT_HASH: ${APP_GIT_HASH}
    image: ghcr.io/paperstacks-io/pdfextractor:latest
    ports:
      - "127.0.0.1:8081:8081"

secrets:
  db_super_password:
    file: ./secrets/db_super_password.txt
  db_app_rw_password:
    file: ./secrets/db_app_rw_password.txt
  db_app_ro_password:
    file: ./secrets/db_app_ro_password.txt

