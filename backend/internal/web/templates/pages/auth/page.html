{{define "auth"}}
<div class="flex justify-center px-4 py-10 sm:px-6 lg:px-10">
  <div class="card bg-base-100 shadow-sm">
    <div class="card-body">
      {{ if eq .HankoAPIURL "" }}
      <h2 class="card-title">Authentication not available</h2>
      <p>You have to set the <strong>HANKO_API_URL</strong> variable in the <strong>.env</strong> file.</p>
      {{ else }}
      <hanko-auth id="authComponent"></hanko-auth>
      <script type="module">
        const authComponent = document.getElementById("authComponent")
        authComponent.addEventListener("onSessionCreated", () => {
          document.location.href = "/app"
        })
      </script>
      {{ end }}
    </div>
  </div>
</div>
{{end}}
