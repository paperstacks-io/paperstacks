{{ define "settings/partials/user" }}
<section id="user-settings-card" class="card bg-base-200 col-span-12 shadow-xs xl:col-span-7">
  <form
    id="user-settings-form"
    class="card-body"
    hx-post="/app/settings/user"
    hx-target="#user-settings-card"
    hx-swap="outerHTML"
    oninput="
      const fields = this.querySelectorAll('[data-initial-value]')
      let dirty = false
      fields.forEach(function (field) {
        if (field.value !== field.dataset.initialValue) dirty = true
      })
      this.querySelector('[data-user-settings-actions]').classList.toggle('hidden', !dirty)
    "
    onreset="
      requestAnimationFrame(function () {
        document.getElementById('user-settings-form').dispatchEvent(new Event('input', { bubbles: true }))
      })
    "
  >
    <div class="flex flex-col gap-2 lg:flex-row lg:items-center">
      <div class="grow">
        <h2 class="card-title">User settings</h2>
      </div>
      <div class="flex flex-wrap gap-2 hidden" data-user-settings-actions>
        <button type="reset" class="btn btn-sm">
          <svg data-src="https://unpkg.com/heroicons/20/solid/arrow-path.svg" class="size-4"></svg>
          Reset
        </button>
        <button type="submit" class="btn btn-sm btn-primary">
          <svg data-src="https://unpkg.com/heroicons/20/solid/check.svg" class="size-4"></svg>
          Save settings
        </button>
      </div>
    </div>

    <div class="grid gap-4 sm:grid-cols-2">
      <fieldset class="fieldset">
        <label class="label" for="user-settings-orcid">ORCID</label>
        <input
          id="user-settings-orcid"
          name="orcid"
          class="input w-full"
          value="{{ .User.ORCID }}"
          data-initial-value="{{ .User.ORCID }}"
          placeholder="0000-0000-0000-0000"
          aria-label="orcid"
        />
      </fieldset>
    </div>
  </form>
</section>
{{ end }}
