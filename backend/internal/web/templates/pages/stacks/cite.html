{{ define "stacks/citation" }}

<header class="col-span-12 flex flex-col gap-4 lg:flex-row lg:items-end">
  <div class="grow">
    <div class="breadcrumbs text-xl">
      <ul>
        <li>
          <a
            href="/app/stacks/page"
            hx-get="/app/stacks/page"
            hx-target="#page-shell"
            hx-select="#page-shell"
            hx-select-oob="#sidebar:outerHTML"
            hx-swap="outerHTML"
            hx-push-url="true"
          >
            Stacks
          </a>
        </li>

        <li>
          <a
            href="/app/stacks/detail/{{ .Stack.UUID }}"
            hx-get="/app/stacks/detail/{{ .Stack.UUID }}"
            hx-target="#page-shell"
            hx-select="#page-shell"
            hx-select-oob="#sidebar:outerHTML"
            hx-swap="outerHTML"
            hx-push-url="true"
          >
            {{ .Stack.Name }}
          </a>
        </li>

        <li>Cite</li>
      </ul>
    </div>
  </div>
</header>

<section id="citation" class="col-span-12 grid gap-6" data-csl-item="{{ .CSLItem }}">
  <div class="grid gap-6 w-full">
    <div class="mt-3">
      <p class="text-lg font-medium leading-snug text-base-content">{{ .Title }}</p>
    </div>
    <div class="card bg-base-200 shadow-xs">
      <div class="card-body">
        <div class="space-y-1">
          <h2 class="card-title">Cite</h2>

          <p class="text-xs text-base-content/60">Copy the citation in your preferred style.</p>
        </div>

        <div class="overflow-x-auto">
          {{ range .Styles }}
          <fieldset class="fieldset">
            <label class="label">{{ .Name }}</label>

            <div class="flex items-center gap-3">
              <textarea
                class="textarea citation-textarea min-w-0 flex-1 resize-none"
                data-style="{{ .Style }}"
                data-csl-path="{{ .Path }}"
                rows="3"
                readonly
              ></textarea>

              <button
                type="button"
                class="btn btn-neutral btn-outline"
                onclick="
                  navigator.clipboard.writeText(this.closest('fieldset').querySelector('.citation-textarea').value)
                "
              >
                <svg data-src="https://unpkg.com/heroicons/20/solid/clipboard-document.svg" class="size-5"></svg>
                Copy
              </button>
            </div>
          </fieldset>
          {{ end }}
        </div>
      </div>
    </div>
  </div>
</section>

<script>
  ;(async () => {
    const citationElement = document.getElementById("citation")

    if (!citationElement) {
      return
    }

    const config = window.CitePlugins.config.get("@csl")

    const textareas = citationElement.querySelectorAll(".citation-textarea")

    for (const textarea of textareas) {
      const style = textarea.dataset.style
      const path = textarea.dataset.cslPath
      if (!path) {
        continue
      }

      const response = await fetch(path)

      if (!response.ok) {
        console.error(`Could not load ${style.toUpperCase()} CSL`)
        continue
      }

      const csl = await response.text()
      config.styles.add(style, csl)
    }

    const paper = JSON.parse(citationElement.dataset.cslItem)
    const cite = new window.Cite(paper)

    textareas.forEach((textarea) => {
      const citation = cite.format("bibliography", {
        format: "text",
        template: textarea.dataset.style,
        lang: "en-US",
      })
      textarea.value = citation.trim()
    })
  })()
</script>

{{ end }}
