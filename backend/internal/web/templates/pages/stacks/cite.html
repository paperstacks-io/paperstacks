{{ define "stacks/cite" }}

<header class="col-span-12 flex flex-col gap-4 lg:flex-row lg:items-end">
  <div class="grow">
    <div class="breadcrumbs text-xl">
      <ul>
        <li>
          <a
            href="/app/stacks/page"
            hx-get="/app/stacks/page"
            hx-target="#page-shell"
            hx-select="#page-shell"
            hx-select-oob="#sidebar:outerHTML"
            hx-swap="outerHTML"
            hx-push-url="true"
          >
            Stacks
          </a>
        </li>

        <li>
          <a
            href="/app/stacks/detail/{{ .Stack.UUID }}"
            hx-get="/app/stacks/detail/{{ .Stack.UUID }}"
            hx-target="#page-shell"
            hx-select="#page-shell"
            hx-select-oob="#sidebar:outerHTML"
            hx-swap="outerHTML"
            hx-push-url="true"
          >
            {{ .Stack.Name }}
          </a>
        </li>

        <li>Cite</li>
      </ul>
    </div>
  </div>
</header>


<section id="citation" class="col-span-12 grid gap-6">
  <div class="grid gap-6 w-full">
    <div class="mt-3">
      <p class="text-lg font-medium leading-snug text-base-content">{{ .Title }}</p>
    </div>
    <div class="card bg-base-200 shadow-xs">
      <div class="card-body">
        <div class="space-y-1">
          <h2 class="card-title">Cite</h2>

          <p class="text-xs text-base-content/60">Copy the citation in your preferred style.</p>
        </div>

        <div class="overflow-x-auto">
          <fieldset class="fieldset">
            <label class="label">IEEE</label>

            <div class="flex items-center gap-3">
              <textarea
                class="textarea citation-textarea min-w-0 flex-1 resize-none"
                data-citation-style="ieee"
                rows="3"
                readonly
              ></textarea>

              <button
                type="button"
                class="btn btn-neutral btn-outline"
                onclick="
                  navigator.clipboard.writeText(this.closest('fieldset').querySelector('.citation-textarea').value)
                "
              >
                <svg data-src="https://unpkg.com/heroicons/20/solid/clipboard-document.svg" class="size-5"></svg>
                Copy
              </button>
            </div>
          </fieldset>

          <fieldset class="fieldset">
            <label class="label">APA</label>

            <div class="flex items-center gap-3">
              <textarea
                class="textarea citation-textarea min-w-0 flex-1 resize-none"
                data-citation-style="apa"
                rows="3"
                readonly
              ></textarea>

              <button
                type="button"
                class="btn btn-neutral btn-outline"
                onclick="
                  navigator.clipboard.writeText(this.closest('fieldset').querySelector('.citation-textarea').value)
                "
              >
                <svg data-src="https://unpkg.com/heroicons/20/solid/clipboard-document.svg" class="size-5"></svg>
                Copy
              </button>
            </div>
          </fieldset>
        </div>
      </div>
    </div>
  </div>
</section>

<script type="module">
  import CSL from "https://esm.sh/citeproc@2.4.63"

  const paperCSL = {{ .CSL }}

  const [ieeeResponse, apaResponse, localeResponse] = await Promise.all([
    fetch("/app/assets/csl/ieee.csl"),
    fetch("/app/assets/csl/apa.csl"),
    fetch("/app/assets/csl/locales-en-US.xml"),
  ])

  if ([ieeeResponse, apaResponse, localeResponse].some((response) => !response.ok)) {
    throw new Error("Could not load the IEEE and APA styles or en-US locale")
  }

  const [ieee, apa, locale] = await Promise.all([ieeeResponse.text(), apaResponse.text(), localeResponse.text()])
  const items = { [paperCSL.id]: paperCSL }

  for (const [name, style] of Object.entries({ ieee, apa })) {
    const processor = new CSL.Engine(
      {
        retrieveLocale: () => locale,
        retrieveItem: (id) => items[id],
      },
      style,
    )

    processor.setOutputFormat("text")
    processor.updateItems([paperCSL.id])
    document.querySelector(`[data-citation-style="${name}"]`).value = processor.makeBibliography()[1].join("\n").trim()
  }
</script>

{{ end }}
