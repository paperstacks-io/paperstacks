{{ define "stacks/partials/stack-create" }} {{ if .Success }}
<div class="toast toast-top toast-end animate-[ping_50ms_linear_2s_1_forwards]">
  <div class="alert alert-success">
    <span>{{ .Message }}</span>
  </div>
</div>
{{ else }}
<div class="alert alert-error">
  <span>{{ .Message }}</span>
</div>
{{ end }} {{ end }}
