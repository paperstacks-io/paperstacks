{{ define "stacks/partials/paper-info" }}
<div class="flex flex-col gap-2 lg:flex-row lg:items-center">
  <div class="grow">
    <h2 class="card-title">Paper Metadata</h2>
  </div>
  <a class="btn btn-sm" hx-get="/app/partials/toast/not-implemented" hx-target="#toast-host" hx-swap="innerHTML"
    >Save changes</a
  >
</div>

<fieldset class="fieldset">
  <p class="label w-full whitespace-normal">
    Access additional metadata, citations, and export formats on Crossref {{ if not .DOI }}(DOI must be set){{ end }}
  </p>
  <a
    href="https://search.crossref.org/?from_ui=yes&q={{ .DOI }}"
    target="_blank"
    rel="noopener noreferrer"
    class="btn btn-sm {{ if not .DOI }}btn-disabled{{ end }}"
    >View on Crossref</a
  >
</fieldset>
<fieldset class="fieldset">
  <label class="label">Title</label>
  <input class="input w-full" value="{{ .Title }}" aria-label="title" />
</fieldset>
<fieldset class="fieldset">
  <label class="label">Authors</label>
  <input
    class="input w-full"
    value="{{ range $i, $author := .Authors }}{{ if $i }}; {{ end }}{{ $author.FullName }}{{ end }}"
    aria-label="authors"
  />
</fieldset>
<fieldset class="fieldset">
  <label class="label">Publication date</label>
  <input class="input w-full" value="{{ .PublicationDate }}" aria-label="publication date" />
</fieldset>

<fieldset class="fieldset">
  <label class="label">DOI</label>
  <div class="join">
    <input type="text" name="doi" class="input input-sm join-item" value="{{ .DOI }}" />
    <a
      href="https://doi.org/{{ .DOI }}"
      target="_blank"
      rel="noopener noreferrer"
      class="btn btn-sm join-item {{ if not .DOI }}btn-disabled{{ end }}"
      >Open</a
    >
  </div>
</fieldset>

<div class="grid gap-2 sm:grid-cols-2">
  <fieldset class="fieldset">
    <label class="label">Journal title</label>
    <input class="input w-full" value="{{ .Metadata.JournalTitle }}" aria-label="metadata journal title" />
  </fieldset>
  <fieldset class="fieldset">
    <label class="label">Journal abbreviation</label>
    <input class="input w-full" value="{{ .Metadata.JournalAbbrev }}" aria-label="metadata journal abbreviation" />
  </fieldset>
  <fieldset class="fieldset">
    <label class="label">Book title</label>
    <input class="input w-full" value="{{ .Metadata.BookTitle }}" aria-label="metadata book title" />
  </fieldset>
  <fieldset class="fieldset">
    <label class="label">Series title</label>
    <input class="input w-full" value="{{ .Metadata.SeriesTitle }}" aria-label="metadata series title" />
  </fieldset>
  <fieldset class="fieldset">
    <label class="label">Event title</label>
    <input class="input w-full" value="{{ .Metadata.EventTitle }}" aria-label="metadata event title" />
  </fieldset>
  <fieldset class="fieldset">
    <label class="label">Event place</label>
    <input class="input w-full" value="{{ .Metadata.EventLocation }}" aria-label="metadata event location" />
  </fieldset>
  <fieldset class="fieldset">
    <label class="label">Institution</label>
    <input class="input w-full" value="{{ .Metadata.Institution }}" aria-label="metadata institution" />
  </fieldset>
</div>

<div class="grid gap-2 sm:grid-cols-2">
  <fieldset class="fieldset">
    <label class="label">Volume</label>
    <input class="input w-full" value="{{ .Metadata.Volume }}" aria-label="metadata volume" />
  </fieldset>
  <fieldset class="fieldset">
    <label class="label">Issue</label>
    <input class="input w-full" value="{{ .Metadata.Issue }}" aria-label="metadata issue" />
  </fieldset>
  <fieldset class="fieldset">
    <label class="label">Pages</label>
    <input class="input w-full" value="{{ .Metadata.Pages }}" aria-label="metadata pages" />
  </fieldset>
</div>

<form
  hx-post="/app/stacks/detail/{{ .StackUUID }}/papers/{{ .UUID }}/upload-pdf"
  hx-encoding="multipart/form-data"
  hx-target="#toast-host"
  hx-swap="innerHTML"
>
  <fieldset class="fieldset">
    <label class="label">PDF</label>
    {{ if .PDFStorageKey }}
    <a class="btn btn-sm join-item"> Download </a>
    {{ else }}
    <input
      name="file"
      type="file"
      class="file-input file-input-sm"
      accept=".pdf,application/pdf"
      required
      onchange="if (this.files.length) this.form.requestSubmit()"
    />
    {{ end }}
  </fieldset>
</form>

{{ end }}
