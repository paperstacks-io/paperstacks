{{ define "stacks/partials/paper-files" }}

<div id="paper-files" class="card bg-base-200 shadow-xs">
  <div class="card-body">
    <h2 class="card-title">Paper Files</h2>
    <div id="paper-pdf-{{ .UUID }}">
      <form
        hx-put="/app/stacks/{{ .StackUUID }}/papers/{{ .UUID }}/pdf"
        hx-encoding="multipart/form-data"
        hx-target="#paper-files"
        hx-swap="outerHTML"
      >
        <fieldset class="fieldset">
          <label class="label" for="paper-pdf-file-{{ .UUID }}">PDF</label>
          {{ if .PDFStorageKey }}
          <div class="grid gap-2 sm:grid-cols-2">
            <a class="btn btn-sm join-item" href="/app/papers/{{ .UUID }}/pdf" onclick="event.stopPropagation()">
              Download
            </a>
            <button
              class="btn btn-sm join-item"
              type="button"
              hx-delete="/app/stacks/{{ .StackUUID }}/papers/{{ .UUID }}/pdf"
              hx-target="#paper-files"
              hx-swap="outerHTML"
              hx-disable="this"
              hx-confirm="Are you sure you want to remove the PDF from this paper?"
              onclick="event.stopPropagation()"
            >
              Remove
            </button>
          </div>
          {{ else }}
          <input
            id="paper-pdf-file-{{ .UUID }}"
            name="file"
            type="file"
            class="file-input file-input-sm"
            accept=".pdf,application/pdf"
            required
            onchange="if (this.files.length) this.form.requestSubmit()"
          />
          {{ end }}
        </fieldset>
      </form>
    </div>
  </div>
</div>
{{ end }}
