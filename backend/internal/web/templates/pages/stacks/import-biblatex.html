{{ define "stacks/import-biblatex" }}
<header class="col-span-12 flex flex-col gap-4 lg:flex-row lg:items-end">
  <div class="grow">
    <div class="breadcrumbs text-xl">
      <ul>
        <li>
          <a
            hx-get="/app/stacks/page"
            hx-target="#page-shell"
            hx-select-oob="#sidebar:outerHTML"
            hx-swap="outerHTML"
            hx-push-url="true"
          >
            Stacks
          </a>
        </li>
        <li>
          <a
            hx-get="/app/stacks/detail/{{ .Stack.UUID }}"
            hx-target="#page-shell"
            hx-select-oob="#sidebar:outerHTML"
            hx-swap="outerHTML"
            hx-push-url="true"
          >
            {{ .Stack.Name}}
          </a>
        </li>
        <li>Import from BibLaTeX</li>
      </ul>
    </div>
  </div>
  <div class="flex flex-wrap gap-2"></div>
</header>

<section class="card bg-base-200 col-span-12 shadow-xs">
  <div class="card-body pb-0">
    <div class="flex flex-col gap-2">
      <div class="grow">
        <h2 class="card-title">Import</h2>
        <p class="text-base-content/60">Import papers into the stack from a BibLaTeX file</p>
      </div>
    </div>
  </div>
  <div class="px-6 pt-4 pb-6">
    <form
      hx-post="/app/stacks/{{ .Stack.UUID }}/import/biblatex"
      hx-encoding="multipart/form-data"
      hx-target="#biblatex-import-results"
      hx-indicator="#biblatex-import-indicator"
      hx-swap="outerHTML"
    >
      <fieldset class="fieldset mx-auto max-w-md">
        <legend class="fieldset-legend">Pick or drop a BibLaTeX file</legend>
        <input type="file" name="bib_file" accept=".bib" required class="file-input w-full" />
        <label class="label">Allowed filetype: *.bib (max size 10MB)</label>
        <button type="submit" class="btn btn-primary" hx-disabled-elt="this">Import papers</button>
      </fieldset>
    </form>
  </div>
</section>

<div id="biblatex-import-results" class="col-span-12 flex items-center justify-center" aria-live="polite">
  <span id="biblatex-import-indicator" class="htmx-indicator loading loading-spinner loading-xl"></span>
</div>
{{ end }}
