{{ define "stack" }}

<div class="flex justify-center px-4 py-10 sm:px-6 lg:px-10">
  <div class="card bg-base-100 shadow-sm w-full">
    <div class="card-body w-full">
      <h2 class="card-title">
        List of stacks
        <span class="htmx-indicator loading loading-spinner loading-sm"></span>
      </h2>

      <div hx-indicator=".htmx-indicator">
        <div class="card w-full">
          <div class="flex flex-row gap-4">
            <label class="input input-bordered flex items-center gap-2 w-full">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-5 w-5 opacity-50"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="m21 21-4.35-4.35m1.6-5.65a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z"
                />
              </svg>

              <input
                type="search"
                name="search"
                placeholder="Search Stacks..."
                hx-post="/app/stacks/search"
                hx-trigger="input changed delay:500ms, keyup[key=='Enter']"
                hx-target="#stack-results"
                hx-vals='{"page": 1}'
              />
            </label>

            {{ if .Session.IsValid }}
            <button
              type="button"
              class="btn bg-black text-white hover:bg-gray-800 border-black"
              onclick="
                create_stack_modal.showModal()
                document.getElementById('create_stack_form').reset()
                document.getElementById('create_stack_error').innerHTML = ''
                document.getElementById('create_stack_submit').disabled = true
              "
            >
              <span>Create stack</span>
            </button>

            <dialog id="create_stack_modal" class="modal">
              <div class="modal-box">
                <div class="card bg-base-100">
                  <div class="card-body">
                    <h2 class="card-title">Create Stack</h2>
                    <form
                      id="create_stack_form"
                      hx-post="/app/stacks/create"
                      hx-target="#create_stack_error"
                      hx-swap="innerHTML"
                      hx-on::before-request="document.getElementById('create_stack_error').innerHTML = ''"
                      hx-on::before-swap="if (!event.detail.successful) event.detail.shouldSwap = true"
                      hx-on::after-request="
    if (event.detail.successful) {
      create_stack_modal.close();
    }
  "
                    >
                      <label class="input input-bordered flex items-center gap-2 w-full">
                        <svg
                          xmlns="http://www.w3.org/2000/svg"
                          class="size-5 opacity-70"
                          viewBox="0 0 24 24"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="2"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                        >
                          <path d="M12 2 2 7l10 5 10-5-10-5Z" />
                          <path d="m2 17 10 5 10-5" />
                          <path d="m2 12 10 5 10-5" />
                        </svg>

                        <input
                          type="text"
                          name="name"
                          placeholder="My Stack"
                          oninput="document.getElementById('create_stack_submit').disabled = this.value.trim() === ''"
                        />
                      </label>
                      <div id="create_stack_error" class="mt-2"></div>

                      <div
                        class="mt-4 flex items-center justify-between rounded-box border border-base-300 bg-base-100 p-4"
                      >
                        <div>
                          <p class="font-medium">Public Stack</p>
                          <p class="text-sm opacity-70">Others can view this stack</p>
                        </div>

                        <input type="checkbox" name="is_public" value="true" class="toggle toggle-success" />
                      </div>

                      <div class="modal-action">
                        <button id="create_stack_submit" type="submit" class="btn btn-primary text-black" disabled>
                          Create
                        </button>

                        <button type="button" class="btn" onclick="create_stack_modal.close()">Close</button>
                      </div>
                    </form>
                  </div>
                </div>
              </div>

              <form method="dialog" class="modal-backdrop">
                <button>close</button>
              </form>
            </dialog>
            <div id="create_stack_success"></div>
            {{ else }}
            <button
              type="button"
              class="btn bg-base-300 text-base-content hover:bg-base-200 gap-2 border border-black/30"
              onclick="login_modal.showModal()"
            >
              <span>Create stack</span>
            </button>

            <dialog id="login_modal" class="modal">
              <div class="modal-box w-auto max-w-none p-0">
                <div class="card bg-base-100 shadow-sm">
                  <div class="card-body">
                    <hanko-auth id="stackAuthComponent"></hanko-auth>
                  </div>
                </div>
              </div>

              <form method="dialog" class="modal-backdrop">
                <button>close</button>
              </form>
            </dialog>
            <script type="module">
              const stackAuthComponent = document.getElementById("stackAuthComponent")

              stackAuthComponent.addEventListener("onSessionCreated", () => {
                document.location.reload()
              })
            </script>
            {{ end }}
          </div>
        </div>
      </div>

      <div id="stack-results"></div>
    </div>
  </div>
</div>

{{ end }}
