{{ define "stacks/page" }}
<header class="col-span-12 flex flex-col gap-4 lg:flex-row lg:items-end">
  <div class="grow">
    <div class="breadcrumbs text-xl">
      <ul>
        <li>Stacks</li>
      </ul>
    </div>
  </div>
  <div class="flex flex-wrap gap-2">
    <button
      class="btn btn-sm btn-primary"
      hx-get="/app/partials/toast/not-implemented"
      hx-target="#toast-host"
      hx-swap="innerHTML"
    >
      <svg data-src="https://unpkg.com/heroicons/20/solid/plus.svg" class="size-4"></svg>
      Create stack
    </button>
    <button class="btn btn-sm" hx-get="/app/partials/toast/not-implemented" hx-target="#toast-host" hx-swap="innerHTML">
      <svg data-src="https://unpkg.com/heroicons/20/solid/arrow-up-tray.svg" class="size-4"></svg>
      Export
    </button>
  </div>
</header>

<!-- stats -->
<section
  class="stats stats-vertical bg-base-200 xl:stats-horizontal col-span-6 shadow-xs"
  hx-trigger="load"
  hx-post="/app/stacks/stats"
  hx-swap="innerHTML"
>
  <div class="stat h-24 skeleton"></div>
  <div class="stat h-24 skeleton"></div>
</section>

<section class="card bg-base-200 col-span-12 shadow-xs">
  <div class="card-body pb-0">
    <div class="flex flex-col gap-2">
      <div class="grow">
        <h2 class="card-title">
          Overview
          <span class="htmx-indicator loading loading-spinner loading-sm"></span>
        </h2>
        <p class="text-base-content/60">Search your stacks.</p>
      </div>
    </div>
  </div>
  <div class="card-body gap-4">
    <form id="stack_search_form" hx-post="/app/stacks/search" hx-trigger="load" hx-target:inherited="#stack-results">
      <div class="flex flex-col gap-3 lg:flex-row">
        <label class="input input-bordered flex items-center gap-2 w-full">
          <svg data-src="https://unpkg.com/heroicons/20/solid/magnifying-glass.svg" class="h-4 w-4 opacity-50"></svg>

          <input
            type="search"
            name="search"
            placeholder="methodology..."
            hx-post="/app/stacks/search"
            hx-trigger="input changed delay:500ms, keyup[key=='Enter']"
            hx-target="#stack-results"
            hx-vals='{"page": 1}'
          />
        </label>

        <select
          class="select select-bordered block w-40"
          name="sortBy"
          hx-post="/app/stacks/my/search"
          hx-trigger="change"
          hx-target="#stack-results"
          hx-vals='{"page": 1}'
        >
          <option value="+name">Name (A-Z)</option>
          <option value="-name">Name (Z-A)</option>
          <option value="+updated_at">Oldest</option>
          <option value="-updated_at" selected>Newest</option>
        </select>
      </div>
    </form>

    <div class="overflow-x-auto">
      <div id="stack-results"></div>
    </div>
  </div>
</section>
{{ end }}
