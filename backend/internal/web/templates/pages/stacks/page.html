{{ define "stack" }}

<div class="flex justify-center px-4 py-10 sm:px-6 lg:px-10">
  <div class="card bg-base-100 shadow-sm w-full">
    <div class="card-body w-full">
      <h2 class="card-title">
        List of stacks
        <span class="htmx-indicator loading loading-spinner loading-sm"></span>
      </h2>

      <form hx-target="#stack-results" hx-indicator=".htmx-indicator">
        <div class="card w-full">
          <div class="flex flex-row gap-4">
            <label class="input input-bordered flex items-center gap-2 w-full">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-5 w-5 opacity-50"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="m21 21-4.35-4.35m1.6-5.65a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z"
                />
              </svg>

              <input
                type="search"
                name="search"
                placeholder="Search Stacks..."
                hx-post="/app/stacks/search"
                hx-trigger="input changed delay:500ms, keyup[key=='Enter']"
                hx-target="#stack-results"
                hx-vals='{"page": 1}'
              />
            </label>

            {{ if .Session.IsValid }}
            <button
              type="button"
              class="btn btn-square btn-primary text-black"
              onclick="
                create_stack_modal.showModal()
                document.getElementById('create_stack_form').reset()
              "
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="size-5"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M12 5v14"></path>
                <path d="M5 12h14"></path>
              </svg>
            </button>

            <dialog id="create_stack_modal" class="modal">
              <div class="modal-box">
                <div class="card bg-base-100">
                  <div class="card-body">
                    <h2 class="card-title">Create Stack</h2>
                    <form id="create_stack_form" method="dialog">
                      <label class="input input-bordered flex items-center gap-2 w-full">
                        <svg
                          xmlns="http://www.w3.org/2000/svg"
                          class="size-5 opacity-70"
                          viewBox="0 0 24 24"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="2"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                        >
                          <path d="M12 2 2 7l10 5 10-5-10-5Z" />
                          <path d="m2 17 10 5 10-5" />
                          <path d="m2 12 10 5 10-5" />
                        </svg>

                        <input type="text" name="name" class="grow" placeholder="My Stack" required />
                      </label>

                      <div
                        class="mt-4 flex items-center justify-between rounded-box border border-base-300 bg-base-100 p-4"
                      >
                        <div>
                          <p class="font-medium">Public Stack</p>
                          <p class="text-sm opacity-70">Others can view this stack</p>
                        </div>

                        <input type="checkbox" name="is_public" value="true" class="toggle toggle-success" />
                      </div>
                    </form>
                    <div class="modal-action">
                      <form method="dialog">
                        <button class="btn btn-primary text-black">Create</button>
                      </form>
                      <form method="dialog">
                        <button class="btn">Close</button>
                      </form>
                    </div>
                  </div>
                </div>
              </div>

              <form method="dialog" class="modal-backdrop">
                <button>close</button>
              </form>
            </dialog>
            {{ else }}
            <button
              type="button"
              class="btn btn-square bg-base-300 text-base-content hover:bg-base-200"
              onclick="login_modal.showModal()"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="size-5"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M12 5v14"></path>
                <path d="M5 12h14"></path>
              </svg>
            </button>

            <dialog id="login_modal" class="modal">
              <div class="modal-box w-auto max-w-none p-0">
                <div class="card bg-base-100 shadow-sm">
                  <div class="card-body">
                    <hanko-auth id="stackAuthComponent"></hanko-auth>
                  </div>
                </div>
              </div>

              <form method="dialog" class="modal-backdrop">
                <button>close</button>
              </form>
            </dialog>
            <script type="module">
              const stackAuthComponent = document.getElementById("stackAuthComponent")

              stackAuthComponent.addEventListener("onSessionCreated", () => {
                document.location.reload()
              })
            </script>
            {{ end }}
          </div>
        </div>
      </form>

      <div id="stack-results"></div>
    </div>
  </div>
</div>

{{ end }}
