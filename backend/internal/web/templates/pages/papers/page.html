{{define "paper"}}

<div class="flex px-4 py-10 sm:px-6 lg:px-10">
  <div class="card bg-base-100 shadow-sm">
    <div class="card-body">
      <h2 class="card-title">List of all papers</h2>
      <form 
	  hx-post="/app/papers/search"
	  hx-target="#search-results"
          hx-trigger="input changed delay:500ms, keyup[key=='Enter'], load"
      >   
        <input
    	  class="form-control"
	  type="search"
	  name="search"
	  placeholder="Search Papers..."
	/>

	<select class="from-control input-bordered w-full" name="sortBy">
          <option value="+title">Title (A-Z)</option>
          <option value="-title">Title (Z-A)</option>
          <option value="+year">Oldest</option>
          <option value="-year">Newest</option>
        </select>
	
      </form>

      <div id="search-results">Is loading</div>
    </div>
  </div>
</div>

{{end}}
