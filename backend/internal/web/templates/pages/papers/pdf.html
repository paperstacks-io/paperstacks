{{ define "papers/pdf" }}
<section class="col-span-12 grid gap-6">
  <div class="epdf-theme">
    <embedpdf-viewer src="{{ .PDFURL }}" id="paper-pdf-viewer" style="height: 100vh"></embedpdf-viewer>
  </div>
</section>

<script type="module">
  import "https://cdn.jsdelivr.net/npm/@embedpdf/viewer@3/dist/embedpdf.js"

  document.getElementById("paper-pdf-viewer").config = {
    readOnly: true,
    features: {
      comments: false,
      "documents.open": false,
    },
  }
</script>

{{ end }}
