{{ define "shared/partials/toast/changes-saved" }}
<div
  class="toast toast-top toast-end animate-[ping_50ms_linear_2s_1_forwards]"
  onanimationend="if (event.target === this) this.remove()"
>

  </div>
</div>
{{ end }}
