name: Backend

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "backend/go.mod"
          cache: false

      - name: Restore cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install dependencies
        run: make deps

      - name: Build
        run: make build

      - name: Unit Test
        run: make test

      - name: Integration Test
        run: make test-integration

  format-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: "npm"
          cache-dependency-path: "backend/package-lock.json"

      - name: Install deps
        run: npm ci

      - name: Format
        run: npm run fmt:check

  docker:
    needs: [build, format-frontend]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute Docker build args
        id: build-args
        working-directory: ./backend
        run: make build-github-output >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/paperstacks-io/paperstacks:latest
            ghcr.io/paperstacks-io/paperstacks:${{ steps.build-args.outputs.app-version }}
          build-args: |
            GO_VERSION=${{ steps.build-args.outputs.go-version }}
            APP_VERSION=${{ steps.build-args.outputs.app-version }}
            APP_GIT_HASH=${{ steps.build-args.outputs.app-git-hash }}
          labels: |
            org.opencontainers.image.source=https://github.com/paperstacks-io/paperstacks
            org.opencontainers.image.description=paperstacks-io
            org.opencontainers.image.licenses=MIT
