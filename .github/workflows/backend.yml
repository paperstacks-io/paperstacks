name: Backend

on:
  push:
    branches: ["main"]
    tags: ["*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    outputs:
      version: ${{ steps.version.outputs.version }}

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "backend/go.mod"
          cache-dependency-path: "backend/go.sum"

      - name: Verify Go modules
        run: go mod tidy && git diff --exit-code -- go.mod go.sum

      - name: Build
        run: make build

      - name: Unit Test
        run: make test

      - name: Integration Test
        run: make test-integration

      - name: Detect version tag
        id: version
        shell: bash
        run: |
          VERSION=""
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VERSION="$GITHUB_REF_NAME"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  db-init-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Smoke test fresh Postgres init scripts
        run: make db-init-smoke

  format-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: "backend/package-lock.json"

      - name: Install deps
        run: npm ci

      - name: Format
        run: npm run fmt:check

  docker:
    if: >
      github.event_name == 'push' &&
      github.ref_type == 'tag' &&
      needs.build.outputs.version != ''
    needs: [build, format-frontend, db-init-smoke]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute Docker build args
        id: build-args
        working-directory: ./backend
        env:
          APP_VERSION: ${{ needs.build.outputs.version }}
        run: make build-github-output >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ghcr.io/paperstacks-io/paperstacks:latest
            ghcr.io/paperstacks-io/paperstacks:${{ steps.build-args.outputs.app-version }}
          build-args: |
            GO_VERSION=${{ steps.build-args.outputs.go-version }}
            APP_VERSION=${{ steps.build-args.outputs.app-version }}
            APP_GIT_HASH=${{ steps.build-args.outputs.app-git-hash }}
          labels: |
            org.opencontainers.image.source=https://github.com/paperstacks-io/paperstacks
            org.opencontainers.image.description=paperstacks-io
            org.opencontainers.image.licenses=MIT
