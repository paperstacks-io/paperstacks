services:
  paperstacks:
    image: ghcr.io/paperstacks-io/paperstacks:latest
    restart: unless-stopped

    env_file: ./.env
    environment:
      HOST: 0.0.0.0
      PORT: 80
    networks:
      - traefik
      - paperstacks
    labels:
      - "traefik.enable=true"
      # HTTPS router
      - "traefik.http.routers.paperstacks.rule=Host(`paperstacks.95.217.168.198.sslip.io`)"
      - "traefik.http.routers.paperstacks.entrypoints=websecure"
      - "traefik.http.routers.paperstacks.tls=true"
      - "traefik.http.routers.paperstacks.tls.certresolver=letsencrypt"
      # Backend service
      - "traefik.http.services.paperstacks.loadbalancer.server.port=80"
      # Docker network
      - "traefik.docker.network=traefik"
      # Auto aupdate via dockcheck
      - "mag37.dockcheck.update=true"

  db:
    image: postgres:18-alpine
    restart: always
    entrypoint:
      - /bin/sh
      - /db/install-pg-cron.sh
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_cron
      - -c
      - cron.database_name=paperstacks
      - -c
      - cron.timezone=UTC
      - -c
      - cron.use_background_workers=on
    # set shared memory limit when using docker compose
    shm_size: 128mb
    networks:
      - paperstacks
    volumes:
      - ../db/init-scripts:/docker-entrypoint-initdb.d:ro
      - ../db/install-pg-cron.sh:/db/install-pg-cron.sh:ro
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/db_super_password
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      PG_CRON_VERSION: "1.6.7"
    secrets:
      - db_super_password
      - db_app_rw_password
      - db_app_ro_password

secrets:
  db_super_password:
    file: ../secrets/db_super_password.txt
  db_app_rw_password:
    file: ../secrets/db_app_rw_password.txt
  db_app_ro_password:
    file: ../secrets/db_app_ro_password.txt

networks:
  traefik:
    external: true
  paperstacks:
