[barman]
barman_home = /var/lib/barman
barman_user = postgres
log_file = /dev/stderr

[paperstacks]
description = Paperstacks PostgreSQL cluster
conninfo = host=db port=5432 dbname=postgres user=paperstacks_backup passfile=/tmp/paperstacks-barman.pgpass
streaming_conninfo = host=db port=5432 dbname=postgres user=paperstacks_backup passfile=/tmp/paperstacks-barman.pgpass
backup_method = postgres
archiver = off
streaming_archiver = on
slot_name = paperstacks_barman
create_slot = auto
